{% if post.featured_image %}
    <a href="{{ post.get_absolute_url }}">
        <picture>
            <img src="{{ post.featured_image.url }}" alt="featured image for blog post" class="blog-card-image">
        </picture>
    </a>
{% endif %}
<div class="blog-card-content">
    <h2 class="blog-card-title">{{post.title}}</h2>
    <!-- <p class="blog-card-excerpt"> -->
        <small class ="date">
            Published {{post.publish}} by {{post.author}}
            <br>
            <!-- {{post.comments.count}} comment{{post.comments.count|pluralize}} -->
        </small>
        <span>{{ post.body|safe|striptags|truncatewords:30|linebreaks }}</span>
    <!-- </p> -->
    <a href="{{ post.get_absolute_url }}" class="blog-card-link">Read More</a>
</div>
