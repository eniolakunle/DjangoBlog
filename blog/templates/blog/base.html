{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% block meta %} {% endblock %}

        <title>{% block title %} {% endblock %}</title>
        {% load compress %}
            <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="any">
            <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">
            <link rel="manifest" href="{% static 'manifest.json' %}" />
            <link rel="stylesheet" href="{% static 'css/simple.css' %}">
        {% compress css %}
            <link rel="stylesheet" href="{% static 'css/custom.css' %}">
            <link rel="stylesheet" href="{% static 'css/transition.css' %}">
            <link rel="stylesheet" href="{% static 'css/splash.css' %}">
            {% block style %} {% endblock %}
            <!-- style overrides; get rid of underlining on links unless onHover-->
            <style>
                #content a, 
                #sidebar a {
                    text-decoration: none;
                }
        
                #content a:hover, 
                #sidebar a:hover {
                    text-decoration: underline;
                }
            </style>
        {% endcompress %}

        <link rel="icon" type=”image/x-icon” href="{% static 'images/favicon.ico' %}">

    </head>

                </div>
            </div>
            <div class="mobile-nav">
                <nav>
                    <button class="menu-button" id="menu-button" title="Menu">☰</button>
                    <div class="menu" id="menu">
                        <a href="{% url 'blog:post_list' %}">Home</a>

            </div>

        <main id="content">
            {% block content %}
            {% endblock %}
        </main>
        <footer id="sidebar">
            <h6>
                <div id="dailyVersesWrapper"></div>
            </h6>
            <img src="{% static 'images/jeezus.jpg' %}" alt="The Christ" id="jesusimg">
        </footer>
        
        <script async defer src="https://dailyverses.net/get/random.js?language=esv"></script>
        <script type="module" src="{% static 'js/scripts.js' %}?v=1.0.3"></script>
        <script type="module" src="{% static 'js/splash.js' %}"></script>
