{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>{% block title %} {% endblock %}</title>
        <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
        <link rel="stylesheet" href="{% static 'css/custom.css' %}">
        <link rel="stylesheet" href="{% static 'css/transition.css' %}">
        <link rel="stylesheet" href="{% static 'css/splash.css' %}">
        <meta name="description" content="The Secret Place is a daily blog about the mysteries of God and the goodness of Jesus. If you're looking for a daily analysis on the Word come check us out!">
        <link rel="icon" type=”image/x-icon” href="{% static 'images/favicon.ico' %}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- style overrides; get rid of underlining on links unless onHover-->
        <style>
            #content a, 
            #sidebar a {
                text-decoration: none;
            }
    
            #content a:hover, 
            #sidebar a:hover {
                text-decoration: underline;
            }
        </style>

        {% block head %}
        {% endblock %}
    </head>

    <body>
        <div id="splash">
            😀
            <h1>Its A Pleasure to See You!</h1>
            <p>
                Please, enjoy an article <small>(or two, or three).</small>
            </p>
        </div>
        
        <div class="transition-overlay"></div>
        <header>
            <div class="top-nav mobile-nav">
                <div class="nav-title">The Secret Place</div>
            </div>
            <div class="mobile-nav">
                <nav>
                    <button class="menu-button" id="menu-button">☰</button>
                    <div class="menu" id="menu">
                        <a href="{% url 'blog:post_list' %}">Home</a>
                        <a href="https://github.com/eniolakunle/DjangoBlog">GitHub</a>
                    </div>
                </nav>
            </div>
        </header>

        
        <div id="content">
            {% block content %}
            {% endblock %}
        </div>
        <footer id="sidebar">
            <h6>
                <div id="dailyVersesWrapper"></div>
            </h6>
            <img src="{% static 'images/jeezus.jpg' %}" alt="The Christ" id="jesusimg">
        </footer>
        <script async defer src="https://dailyverses.net/get/random.js?language=esv"></script>
        <script type="module" src="{% static 'js/scripts.js' %}"></script>
        <script src="{% static 'js/splash.js' %}"></script>
    </body>
</html>
