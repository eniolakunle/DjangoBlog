<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔒Password Required🔒</title>
  <style>
    html, body {
      height: 100%;
    }
    body, header, main{
      display: flex;
      align-items: center;
    }
    body, main{
      justify-content: center;
    }
    header, main {
      flex-direction: column;
      text-align: center;
    }
    main{
      height: 75%;
    }
    header {
      margin-top: -25%;
    }
    /* Global styling for the body */
    body {
      background-color: #f7f7f7; /* Subtle light gray background */
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* Main container styling */
    main {
      max-width: 400px;
      margin: 5% auto;
      background-color: #fff;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    /* Header styling */
    header h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    header h3 {
      font-size: 1rem;
      text-align: center;
      color: #666;
      margin-bottom: 1.5rem;
    }

    /* Error message styling */
    p {
      text-align: center;
      margin-bottom: 1rem;
    }

    form label {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    form input[type="password"] {
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 1rem;
      transition: border-color 0.3s ease;
    }

    form input[type="password"]:focus {
      border-color: #007BFF;
      outline: none;
    }

    form button {
      padding: 0.7rem;
      font-size: 1rem;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    form button:hover {
      background-color: #0056b3;
    }

    /* Anchor tag styling for light mode */
    a {
      color: #007BFF;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #0056b3;
    }
    /* Dark mode styling */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #ddd;
      }

      main {
        background-color: #2a2a2a;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      header h1,
      header h3 {
        color: #ddd;
      }

      header h3 {
        color: #bbb;
      }

      form input[type="password"] {
        background-color: #444;
        border: 1px solid #666;
        color: #ddd;
      }

      form input[type="password"]:focus {
        border-color: #66afe9;
      }

      form button {
        background-color: #66afe9;
      }

      form button:hover {
        background-color: #559cd6;
      }
      a {
        color: #66afe9;
      }
      
      a:hover {
        color: #559cd6;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>The Secret Place is EXCLUSIVELY For Followers!</h1>
      <h3>DM on <a href="https://www.tiktok.com/@lefromdeway2/">TikTok</a> or <a href="https://www.instagram.com/lefromdeway/">IG</a> for access.</h3>
    </header>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Enter Password:</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Submit</button>
  </form>
</main>
</body>
</html>
